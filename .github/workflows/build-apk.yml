name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Függőségek telepítése
        run: npm install

      - name: Web fájlok összeállítása
        run: npm run build

      - name: Android projekt létrehozása
        run: |
          npx cap add android
          npx cap sync android

      - name: APK építése
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: hianyzaskovet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
